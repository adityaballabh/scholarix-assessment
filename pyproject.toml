[tool.ruff]
required-version = ">=0.15,<0.16"
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Ignore notebook display lines
"*.ipynb" = ["E501"]
# Skip publication titles
"frontend/scripts/mock_data_config.py" = ["E501"]

[tool.ruff.format]
# Publication title dicts stay one line each
exclude = ["frontend/scripts/mock_data_config.py"]
