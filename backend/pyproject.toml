[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-review-backend"
version = "0.1.0"
description = "Evidence fetch and review queue API for Merge Review"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<1",
    "pydantic-settings>=2.15,<3",
    "psycopg[binary]>=3.3.4,<4",
    "pwdlib[argon2]>=0.3.1,<1",
    "PyJWT>=2.13,<3",
    "requests>=2.34.2,<3",
    "requests-cache>=1.3.3,<2",
    "requests-ratelimiter>=0.10,<1",
    "sqlalchemy>=2.0.52,<3",
    "Unidecode>=1.4,<2",
    "uvicorn[standard]>=0.52.4,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.10,<3",
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
